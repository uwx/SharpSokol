# LLM maintained.
# Builds native/sokol_unity.c into one linkable library per platform/backend
# combination (see native/sokol_unity.c and the README for the full matrix).
# Each combo is its own parallel job producing a self-contained dynamic
# library (.dll/.so/.dylib), except wasm which produces a static .a for
# consumers to link into their own emcc invocation.
#
# The WGPU backend is only built for wasm (via Emscripten's emdawnwebgpu
# port, i.e. Dawn). Native WGPU builds against wgpu-native are not currently
# possible: sokol_app.h's WGPU backend calls wgpuDeviceSetLoggingCallback /
# WGPULoggingCallbackInfo, which is a Dawn-only API not implemented by
# wgpu-native (confirmed absent from wgpu-native's vendored webgpu-headers,
# including trunk) - sokol_app.h itself documents WGPU support as "tested
# with webgpu_dawn". Revisit if wgpu-native ever adds this, or if sokol
# guards the call for non-Dawn implementations.
name: Build Native Libraries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [native/**, sokol/**, .github/workflows/build-native.yml]
  pull_request:
    paths: [native/**, sokol/**, .github/workflows/build-native.yml]
  # invoked by release.yml to build the binaries it packages/publishes
  workflow_call:

env:
  VULKAN_SDK_VERSION: 1.4.335.0

jobs:
  windows:
    name: ${{ matrix.target }}-${{ matrix.backend }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32,    msvc_arch: x86,        backend: d3d11 }
          - { target: win32,    msvc_arch: x86,        backend: glcore }
          - { target: win64,    msvc_arch: amd64,      backend: d3d11 }
          - { target: win64,    msvc_arch: amd64,      backend: glcore }
          - { target: win64,    msvc_arch: amd64,      backend: vulkan }
          - { target: winarm64, msvc_arch: amd64_arm64, backend: d3d11 }
          - { target: winarm64, msvc_arch: amd64_arm64, backend: glcore }
          - { target: winarm64, msvc_arch: amd64_arm64, backend: vulkan }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # humbletim/setup-vulkan-sdk builds Vulkan-Loader itself, but its
      # Configure/Build steps are hardcoded to `vsdevenv x64 bash` with no
      # architecture input - it can only ever produce an x64 loader, which
      # fails outright (ml64.exe assembling under a contaminated ARM64 cross
      # env) when combined with the amd64_arm64 toolset set up above for
      # winarm64. Use it as-is for win64; for winarm64 build Vulkan-Headers +
      # Vulkan-Loader from source instead, via the Ninja generator (a
      # single-config generator that - unlike the default MSBuild/.vcxproj
      # generator - just uses whatever cl.exe/link.exe/armasm64.exe is
      # currently active on PATH, i.e. respects the amd64_arm64 env above).
      - name: prepare vulkan sdk
        if: matrix.backend == 'vulkan' && matrix.target != 'winarm64'
        uses: humbletim/setup-vulkan-sdk@main
        with:
          vulkan-query-version: ${{ env.VULKAN_SDK_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: prepare vulkan sdk (winarm64 cross build)
        if: matrix.backend == 'vulkan' && matrix.target == 'winarm64'
        shell: cmd
        run: |
          git clone --branch vulkan-sdk-%VULKAN_SDK_VERSION% --depth 1 https://github.com/KhronosGroup/Vulkan-Headers vulkan-headers-src
          cmake -G Ninja -S vulkan-headers-src -B vulkan-headers-src\build -DCMAKE_INSTALL_PREFIX=%CD%\vulkan-arm64 || exit /b 1
          cmake --build vulkan-headers-src\build --target install || exit /b 1

          git clone --branch vulkan-sdk-%VULKAN_SDK_VERSION% --depth 1 https://github.com/KhronosGroup/Vulkan-Loader vulkan-loader-src
          cmake -G Ninja -S vulkan-loader-src -B vulkan-loader-src\build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%CD%\vulkan-arm64 -DCMAKE_INSTALL_PREFIX=%CD%\vulkan-arm64 -DBUILD_TESTS=OFF || exit /b 1
          cmake --build vulkan-loader-src\build --target install || exit /b 1

      - name: build
        shell: cmd
        run: |
          set BACKEND_DEFINE=SOKOL_${{ matrix.backend }}
          if /I "${{ matrix.backend }}"=="d3d11" set BACKEND_DEFINE=SOKOL_D3D11
          if /I "${{ matrix.backend }}"=="glcore" set BACKEND_DEFINE=SOKOL_GLCORE
          if /I "${{ matrix.backend }}"=="vulkan" set BACKEND_DEFINE=SOKOL_VULKAN

          set EXTRA_INCLUDE=
          set EXTRA_LIBS=
          if /I "${{ matrix.backend }}"=="vulkan" (
            if /I "${{ matrix.target }}"=="winarm64" (
              set EXTRA_INCLUDE=/I vulkan-arm64\include
              set EXTRA_LIBS=vulkan-arm64\lib\vulkan-1.lib
            ) else (
              set EXTRA_INCLUDE=/I "%VULKAN_SDK%\Include"
              set EXTRA_LIBS="%VULKAN_SDK%\Lib\vulkan-1.lib"
            )
          )

          cl /nologo /LD /MD /DSOKOL_DLL /D%BACKEND_DEFINE% /I sokol %EXTRA_INCLUDE% native\sokol_unity.c ^
            /Fe:sokol_${{ matrix.target }}_${{ matrix.backend }}.dll ^
            /link %EXTRA_LIBS%

      - uses: actions/upload-artifact@v4
        with:
          name: sokol-${{ matrix.target }}-${{ matrix.backend }}
          path: sokol_${{ matrix.target }}_${{ matrix.backend }}.dll

  macos:
    name: ${{ matrix.target }}-${{ matrix.backend }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-x64,   arch: x86_64, backend: metal }
          - { target: macos-x64,   arch: x86_64, backend: glcore }
          - { target: macos-arm64, arch: arm64,  backend: metal }
          - { target: macos-arm64, arch: arm64,  backend: glcore }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: build
        run: |
          BACKEND_DEFINE=SOKOL_$(echo "${{ matrix.backend }}" | tr '[:lower:]' '[:upper:]')
          EXTRA_INCLUDE=""
          EXTRA_LIBS="-framework QuartzCore -framework AppKit -framework AudioToolbox"
          case "${{ matrix.backend }}" in
            metal)  EXTRA_LIBS="$EXTRA_LIBS -framework Metal" ;;
            glcore) EXTRA_LIBS="$EXTRA_LIBS -framework OpenGL" ;;
          esac

          # sokol_app.h requires the implementation to be compiled as
          # Objective-C on macOS (it pulls in Metal.h/Foundation.h etc.)
          clang -dynamiclib -arch ${{ matrix.arch }} -D"$BACKEND_DEFINE" -Isokol $EXTRA_INCLUDE \
            -x objective-c native/sokol_unity.c -o libsokol_${{ matrix.target }}_${{ matrix.backend }}.dylib \
            $EXTRA_LIBS

      - uses: actions/upload-artifact@v4
        with:
          name: sokol-${{ matrix.target }}-${{ matrix.backend }}
          path: libsokol_${{ matrix.target }}_${{ matrix.backend }}.dylib

  linux:
    name: ${{ matrix.target }}-${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,   runner: ubuntu-latest,    backend: glcore }
          - { target: linux-x64,   runner: ubuntu-latest,    backend: gles3 }
          - { target: linux-x64,   runner: ubuntu-latest,    backend: vulkan }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, backend: glcore }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, backend: gles3 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, backend: vulkan }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev mesa-common-dev xorg-dev libasound-dev libvulkan-dev

      - name: build
        run: |
          BACKEND_DEFINE=SOKOL_$(echo "${{ matrix.backend }}" | tr '[:lower:]' '[:upper:]')
          EXTRA_INCLUDE=""
          EXTRA_LIBS="-lX11 -lXi -lXcursor -lasound -ldl -lm -lpthread"
          case "${{ matrix.backend }}" in
            glcore) EXTRA_LIBS="$EXTRA_LIBS -lGL" ;;
            gles3)  EXTRA_LIBS="$EXTRA_LIBS -lEGL -lGL" ;;
            vulkan) EXTRA_LIBS="$EXTRA_LIBS -lvulkan" ;;
          esac

          cc -shared -fPIC -D"$BACKEND_DEFINE" -Isokol $EXTRA_INCLUDE \
            native/sokol_unity.c -o libsokol_${{ matrix.target }}_${{ matrix.backend }}.so \
            $EXTRA_LIBS

      - uses: actions/upload-artifact@v4
        with:
          name: sokol-${{ matrix.target }}-${{ matrix.backend }}
          path: libsokol_${{ matrix.target }}_${{ matrix.backend }}.so

  wasm:
    name: wasm-${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [gles3, wgpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: mymindstorm/setup-emsdk@v14

      - name: build
        run: |
          BACKEND_DEFINE=SOKOL_$(echo "${{ matrix.backend }}" | tr '[:lower:]' '[:upper:]')
          PORT_FLAG=""
          if [ "${{ matrix.backend }}" = "wgpu" ]; then
            PORT_FLAG="--use-port=emdawnwebgpu"
          fi

          emcc -c -D"$BACKEND_DEFINE" $PORT_FLAG -Isokol native/sokol_unity.c -o sokol_unity.o
          emar rcs libsokol_wasm_${{ matrix.backend }}.a sokol_unity.o

      - uses: actions/upload-artifact@v4
        with:
          name: sokol-wasm-${{ matrix.backend }}
          path: libsokol_wasm_${{ matrix.backend }}.a
